# Pointwise MLP baseline (src/train.py). Hyperparameters chosen a priori, not tuned yet.
task = "full"       # full | scarce | aoa
seed = 0
width = 256         # neurons per hidden layer
depth = 5           # hidden layers -> 266k parameters
steps = 100_000     # optimiser updates
batch = 65_536      # random points per update
lr = 1e-3           # Adam learning rate, cosine decay to 0
val_every = 2_000   # validation loss + checkpoint every N steps
